syntax = "proto3";

package civil.public.parties.v1;

import "buf/validate/validate.proto";
import "civil/public/pagination/v1/pagination.proto";
import "google/protobuf/timestamp.proto";

// Reads parties: the owners, grantors and grantees that parcels and
// transfers refer to by `party_id`.
//
// Every read takes an optional `legal_as_of`, defaulting to now. A party is
// returned only when it isn't voided and has a record at that time.
service PartiesService {
  // Returns the requested parties. Unknown IDs, voided parties and parties
  // with no record at `legal_as_of` are left out.
  rpc GetPartiesById(GetPartiesByIdRequest) returns (GetPartiesByIdResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Returns the parcels a party holds at `legal_as_of`, each with its
  // ownership share, ordered by `parcel_id`. Voided parcels and parcels with
  // no geometry or record then are left out. An unknown or voided party has
  // no parcels.
  rpc GetParcelsByPartyId(GetParcelsByPartyIdRequest) returns (GetParcelsByPartyIdResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// A party as of `legal_as_of`.
message Party {
  // The party's UUID.
  string party_id = 1;

  // The party's name.
  string name = 2;

  // The UUID of the party's mailing address. Unset when that address is
  // voided or has no record at `legal_as_of`, so a set ID can always be
  // read with `AddressesService.GetAddressesById`.
  optional string mailing_address_id = 3;

  // The mailing address's formatted text. Set exactly when
  // `mailing_address_id` is.
  optional string mailing_address = 4;
}

// A parcel a party holds.
message PartyParcel {
  // The parcel's UUID.
  string parcel_id = 1;

  // The parcel's geometry feature ID at `legal_as_of`.
  optional int64 feature_id = 2;

  // The party's share of the parcel, a decimal string in (0, 1] with up to
  // 4 places, such as "0.5000".
  string ownership_share = 3;
}

message GetPartiesByIdRequest {
  // 1 to 100 unique party UUIDs.
  repeated string party_ids = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
    unique: true
    items: {
      string: {uuid: true}
    }
  }];

  // The legal time to read the parties at. Defaults to now.
  optional google.protobuf.Timestamp legal_as_of = 2 [(buf.validate.field).timestamp = {
    // Bounded to prevent integer overflow or absurd historical queries
    gt: {seconds: -62135596800} /* Approx Jan 1, 0 CE */
  }];
}

message GetPartiesByIdResponse {
  // The parties found, keyed by party UUID.
  map<string, Party> parties = 1;
}

message GetParcelsByPartyIdRequest {
  // The party's UUID.
  string party_id = 1 [(buf.validate.field).string.uuid = true];

  // The legal time to read the holdings at. Defaults to now.
  optional google.protobuf.Timestamp legal_as_of = 2 [(buf.validate.field).timestamp = {
    gt: {seconds: -62135596800} /* Approx Jan 1, 0 CE */
  }];

  // The page size, 1 to 100. Defaults to 25.
  optional int32 first = 3 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];

  // Return the parcels after this cursor, from a previous page of the same
  // request.
  optional string after = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 512
  }];
}

message GetParcelsByPartyIdResponse {
  // The page's parcels, ordered by `parcel_id`. Fewer than `first` only on
  // the last page.
  repeated PartyParcel parcels = 1;
  civil.public.pagination.v1.PageInfo page_info = 2;
}

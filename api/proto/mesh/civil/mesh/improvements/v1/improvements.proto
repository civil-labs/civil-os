syntax = "proto3";

package civil.mesh.improvements.v1;

import "civil/mesh/pagination/v1/pagination.proto";
import "google/protobuf/timestamp.proto";

service ImprovementsReadService {
  rpc GetImprovementTypes(GetImprovementTypesRequest) returns (GetImprovementTypesResponse) {}

  rpc GetImprovementConditions(GetImprovementConditionsRequest) returns (GetImprovementConditionsResponse) {}

  rpc GetImprovementsByAddressId(GetImprovementsByAddressIdRequest) returns (GetImprovementsByAddressIdResponse) {}

  rpc GetImprovementQualities(GetImprovementQualitiesRequest) returns (GetImprovementQualitiesResponse) {}
}

message ImprovementType {
  string id = 1;
  string name = 2;
  string code = 3;
  string description = 4;
}

message GetImprovementTypesRequest {}

message GetImprovementTypesResponse {
  map<string, ImprovementType> improvement_types = 1;
}

message ImprovementCondition {
  string id = 1;
  string name = 2;
  // Set to optional to allow it to properly pass zero values
  optional float depreciation_modifier = 3;
}

message GetImprovementConditionsRequest {}

message GetImprovementConditionsResponse {
  map<string, ImprovementCondition> improvement_conditions = 1;
}

message AddressImprovement {
  string improvement_id = 1;
  repeated string parcel_ids = 2;
}

message GetImprovementsByAddressIdRequest {
  string address_id = 1;
  optional google.protobuf.Timestamp legal_as_of = 2;
  optional int32 first = 3;
  optional string after = 4;
}

message GetImprovementsByAddressIdResponse {
  repeated AddressImprovement improvements = 1;
  civil.mesh.pagination.v1.PageInfo page_info = 2;
}

message ImprovementQuality {
  string id = 1;
  string name = 2;
  double quality_adjustment_modifier = 3;
}

message GetImprovementQualitiesRequest {}

message GetImprovementQualitiesResponse {
  map<string, ImprovementQuality> improvement_qualities = 1;
}

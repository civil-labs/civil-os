syntax = "proto3";

package civil.mesh.parcels.v1;

import "google/protobuf/timestamp.proto";
import "google/type/interval.proto";

service ParcelsService {
  // Retrieves the value for a specified attribute for a given parcel
  rpc GetParcelsWithImprovementSummaryByParcelId(GetParcelsWithImprovementSummaryByParcelIdRequest) returns (GetParcelsWithImprovementSummaryByParcelIdResponse) {}

  rpc GetParcelsWithImprovementSummaryByFeatureId(GetParcelsWithImprovementSummaryByFeatureIdRequest) returns (GetParcelsWithImprovementSummaryByFeatureIdResponse) {}

  // Retrieves a set of summary statistics about the specified numerical attribute for a specified list of parcels. Optionally returns the values as well
  rpc GetNumericalParcelStatsById(GetNumericalParcelStatsByIdRequest) returns (GetNumericalParcelStatsByIdResponse) {}

  // Retrieves a set of summary statistics about the specified categorical attribute for a specified list of parcels. Optionally returns the values as well
  rpc GetCategoricalParcelStatsById(GetCategoricalParcelStatsByIdRequest) returns (GetCategoricalParcelStatsByIdResponse) {}

  rpc GetEquityComparables(GetEquityComparablesRequest) returns (GetEquityComparablesResponse) {}

  rpc GetSalesComparables(GetSalesComparablesRequest) returns (GetSalesComparablesResponse) {}

  rpc GetParcelIdsByFeatureId(GetParcelIdsByFeatureIdRequest) returns (GetParcelIdsByFeatureIdResponse) {}

  rpc GetEstimatedParcelsExtentWGS84(GetEstimatedParcelsExtentWGS84Request) returns (GetEstimatedParcelsExtentWGS84Response) {}

  rpc GetLandAreaSqftByParcelId(GetLandAreaSqftByParcelIdRequest) returns (GetLandAreaSqftByParcelIdResponse) {}

  rpc GetFrontageFtByParcelId(GetFrontageFtByParcelIdRequest) returns (GetFrontageFtByParcelIdResponse) {}

  rpc GetDepthFtByParcelId(GetDepthFtByParcelIdRequest) returns (GetDepthFtByParcelIdResponse) {}

  rpc GetLandUseIdSqftByParcelId(GetLandUseIdSqftByParcelIdRequest) returns (GetLandUseIdSqftByParcelIdResponse) {}

  rpc GetZoningIdByParcelId(GetZoningIdByParcelIdRequest) returns (GetZoningIdByParcelIdResponse) {}

  rpc GetImprovementAreaSqftByParcelId(GetImprovementAreaSqftByParcelIdRequest) returns (GetImprovementAreaSqftByParcelIdResponse) {}

  rpc GetBedroomsByParcelId(GetBedroomsByParcelIdRequest) returns (GetBedroomsByParcelIdResponse) {}

  rpc GetBathroomsByParcelId(GetBathroomsByParcelIdRequest) returns (GetBathroomsByParcelIdResponse) {}

  rpc GetUnitsByParcelId(GetUnitsByParcelIdRequest) returns (GetUnitsByParcelIdResponse) {}

  rpc GetPrimaryImprovementYearBuiltByParcelId(GetPrimaryImprovementYearBuiltByParcelIdRequest) returns (GetPrimaryImprovementYearBuiltByParcelIdResponse) {}

  rpc GetPrimaryImprovementEffectiveYearBuiltByParcelId(GetPrimaryImprovementEffectiveYearBuiltByParcelIdRequest) returns (GetPrimaryImprovementEffectiveYearBuiltByParcelIdResponse) {}

  rpc GetPrimaryImprovementConditionIdByParcelId(GetPrimaryImprovementConditionIdByParcelIdRequest) returns (GetPrimaryImprovementConditionIdByParcelIdResponse) {}

  rpc GetPrimaryImprovementTypeIdByParcelId(GetPrimaryImprovementTypeIdByParcelIdRequest) returns (GetPrimaryImprovementTypeIdByParcelIdResponse) {}

  rpc GetLandAreaSqftByFeatureId(GetLandAreaSqftByFeatureIdRequest) returns (GetLandAreaSqftByFeatureIdResponse) {}

  rpc GetFrontageFtByFeatureId(GetFrontageFtByFeatureIdRequest) returns (GetFrontageFtByFeatureIdResponse) {}

  rpc GetDepthFtByFeatureId(GetDepthFtByFeatureIdRequest) returns (GetDepthFtByFeatureIdResponse) {}

  rpc GetLandUseIdSqftByFeatureId(GetLandUseIdSqftByFeatureIdRequest) returns (GetLandUseIdSqftByFeatureIdResponse) {}

  rpc GetZoningIdByFeatureId(GetZoningIdByFeatureIdRequest) returns (GetZoningIdByFeatureIdResponse) {}

  rpc GetImprovementAreaSqftByFeatureId(GetImprovementAreaSqftByFeatureIdRequest) returns (GetImprovementAreaSqftByFeatureIdResponse) {}

  rpc GetBedroomsByFeatureId(GetBedroomsByFeatureIdRequest) returns (GetBedroomsByFeatureIdResponse) {}

  rpc GetBathroomsByFeatureId(GetBathroomsByFeatureIdRequest) returns (GetBathroomsByFeatureIdResponse) {}

  rpc GetUnitsByFeatureId(GetUnitsByFeatureIdRequest) returns (GetUnitsByFeatureIdResponse) {}

  rpc GetPrimaryImprovementYearBuiltByFeatureId(GetPrimaryImprovementYearBuiltByFeatureIdRequest) returns (GetPrimaryImprovementYearBuiltByFeatureIdResponse) {}

  rpc GetPrimaryImprovementEffectiveYearBuiltByFeatureId(GetPrimaryImprovementEffectiveYearBuiltByFeatureIdRequest) returns (GetPrimaryImprovementEffectiveYearBuiltByFeatureIdResponse) {}

  rpc GetPrimaryImprovementConditionIdByFeatureId(GetPrimaryImprovementConditionIdByFeatureIdRequest) returns (GetPrimaryImprovementConditionIdByFeatureIdResponse) {}

  rpc GetPrimaryImprovementTypeIdByFeatureId(GetPrimaryImprovementTypeIdByFeatureIdRequest) returns (GetPrimaryImprovementTypeIdByFeatureIdResponse) {}

  // Mutation

  rpc UpdateParcel(UpdateParcelRequest) returns (UpdateParcelResponse) {}
}

message ParcelAffordances {
  repeated string affordance_ids = 1;
  optional double max_far = 2;
  optional double min_lot_size_sq_ft = 3;
  optional double max_height_ft = 4;
  optional double max_dwelling_units_per_acre = 5;
  optional double max_lot_coverage_pct = 6;
}

message ParcelImprovementsSummary {
  repeated string improvement_ids = 1;

  string primary_improvement_id = 2;

  // Physically impossible to be negative
  double total_area_sq_ft = 3;

  int32 total_bathrooms = 4;

  int32 total_bedrooms = 5;

  int32 total_units = 6;

  optional int32 primary_year_built = 7;

  optional int32 primary_effective_year_built = 8;

  optional string primary_condition_id = 9;

  optional string total_market_improvement_value = 10;

  optional string total_assessed_improvement_value = 11;
}

message ParcelDetails {
  string parcel_id = 1;

  optional int64 feature_id = 2;

  optional string formatted_address = 3;

  optional string address_id = 4;

  optional string primary_owner_name = 5;

  optional string primary_owner_address = 6;

  repeated string party_ids = 7;

  optional string land_use_id = 8;

  optional string neighborhood_id = 9;

  optional double land_area_sq_ft = 10;

  optional double frontage_ft = 11;

  optional double depth_ft = 12;

  repeated string zoning_ids = 13;

  optional string market_land_value = 14;

  optional string assessed_land_value = 15;

  optional string properties = 16;
}

message ParcelWithImprovementSummary {
  ParcelDetails parcel_details = 1;
  ParcelImprovementsSummary improvement_summary = 2;
}

message GetParcelsWithImprovementSummaryByParcelIdRequest {
  repeated string parcel_ids = 1;

  optional google.protobuf.Timestamp legal_as_of = 2;

  optional string valuation_id = 3;

  optional string neighborhood_definition_id = 4;
}

message GetParcelsWithImprovementSummaryByParcelIdResponse {
  // A map of parcel records, keyed by their public ID.
  map<string, ParcelWithImprovementSummary> parcels = 1;
}

message GetParcelsWithImprovementSummaryByFeatureIdRequest {
  repeated int64 feature_ids = 1;

  optional google.protobuf.Timestamp legal_as_of = 2;

  optional string valuation_id = 3;

  optional string neighborhood_definition_id = 4;
}

message GetParcelsWithImprovementSummaryByFeatureIdResponse {
  map<string, ParcelWithImprovementSummary> parcels = 1;
}

message UpdateParcelRequest {
  string parcel_id = 1;
  optional string address_id = 2;
  optional string land_use_id = 3;
  optional double land_area_sq_ft = 4;
  optional double frontage_ft = 5;
  optional double depth_ft = 6;
  optional string properties = 7;
}

message UpdateParcelResponse {}

enum ParcelAttribute {
  PARCEL_ATTRIBUTE_UNSPECIFIED = 0;
  PARCEL_ATTRIBUTE_LAND_AREA_SQ_FT = 1;
  PARCEL_ATTRIBUTE_FRONTAGE_FT = 2;
  PARCEL_ATTRIBUTE_DEPTH_FT = 3;
  PARCEL_ATTRIBUTE_LAND_USE_ID = 4;
  PARCEL_ATTRIBUTE_ZONING_ID = 5;
  PARCEL_ATTRIBUTE_IMPROVEMENT_AREA_SQ_FT = 6;
  PARCEL_ATTRIBUTE_BEDROOMS = 7;
  PARCEL_ATTRIBUTE_BATHROOMS = 8;
  PARCEL_ATTRIBUTE_UNITS = 9;
  PARCEL_ATTRIBUTE_PRIMARY_IMPROVEMENT_YEAR_BUILT = 10;
  PARCEL_ATTRIBUTE_PRIMARY_IMPROVEMENT_EFFECTIVE_YEAR_BUILT = 11;
  PARCEL_ATTRIBUTE_PRIMARY_IMPROVEMENT_CONDITION_ID = 12;
  PARCEL_ATTRIBUTE_PRIMARY_IMPROVEMENT_TYPE_ID = 13;
}

message GetNumericalParcelStatsByIdRequest {
  repeated string parcel_ids = 1;
  ParcelAttribute attribute = 2;
  optional google.protobuf.Timestamp legal_as_of = 3;
  optional google.protobuf.Timestamp system_as_of = 4;
}

message GetNumericalParcelStatsByIdResponse {
  float mode = 1;
  float minimum = 2;
  float maximum = 3;
  float range = 4;

  float percentile_10 = 5;
  float percentile_20 = 6;
  float percentile_30 = 7;
  float percentile_40 = 8;
  float percentile_50 = 9;
  float percentile_60 = 10;
  float percentile_70 = 11;
  float percentile_80 = 12;
  float percentile_90 = 13;
  float percentile_100 = 14;

  float mean = 15;
  float standard_deviation = 16;
  float coefficient_of_dispersion = 17;
}

message GetCategoricalParcelStatsByIdRequest {
  repeated string parcel_ids = 1;
  ParcelAttribute attribute = 2;
  optional google.protobuf.Timestamp legal_as_of = 3;
  optional google.protobuf.Timestamp system_as_of = 4;
}

message GetCategoricalParcelStatsByIdResponse {
  string mode = 1;

  map<string, int32> unique_values = 2;
}

message ComparableCriteria {
  ParcelAttribute attribute = 1;
  optional double min_numerical_tolerance = 2;
  optional double max_numerical_tolerance = 3;
  repeated string categorical_tolerance = 4;
}

message ComparableAttribute {
  ParcelAttribute attribute = 1;
  optional double numerical_value = 2;
  optional string categorical_value = 3;
}

message EquityComparableParcel {
  string parcel_id = 1;
  int64 feature_id = 2;
  string address_id = 3;
  string formatted_address = 4;
  repeated ComparableAttribute attributes = 5;
}

message SaleComparableParcel {
  string parcel_id = 1;
  int64 feature_id = 2;
  string address_id = 3;
  string formatted_address = 4;
  google.protobuf.Timestamp sale_time = 5;
  string sale_price = 6;
  repeated ComparableAttribute attributes = 7;
}

message GetEquityComparablesRequest {
  string wkt_polygon = 1;
  repeated ComparableCriteria criteria = 2;
  repeated string selected_parcel_ids = 3;
}

message GetEquityComparablesResponse {
  map<string, EquityComparableParcel> parcels = 1;
}

message GetSalesComparablesRequest {
  string wkt_polygon = 1;
  repeated ComparableCriteria criteria = 2;
  repeated string selected_parcel_ids = 3;
  google.type.Interval time_range = 4;
}

message GetSalesComparablesResponse {
  map<string, SaleComparableParcel> parcels = 1;
}

message SimpleParcel {
  string parcel_id = 1;
  int64 feature_id = 2;
  optional string formatted_address = 3;
  optional string address_id = 4;
  optional string primary_owner_name = 5;
  optional string primary_owner_address = 6;
  repeated string party_ids = 7;
  optional string land_use_id = 8;
  optional string neighborhood_id = 9;
  optional double land_area_sq_ft = 10;
  optional double frontage_ft = 11;
  optional double depth_ft = 12;
  repeated string zoning_ids = 13;
  optional string market_land_value = 14;
  optional string assessed_land_value = 15;
  optional string properties = 18;
}

message GetParcelIdsByFeatureIdRequest {
  repeated int64 feature_ids = 1;
}

message GetParcelIdsByFeatureIdResponse {
  map<int64, string> parcel_ids = 1;
}

message GetEstimatedParcelsExtentWGS84Request {}

message GetEstimatedParcelsExtentWGS84Response {
  double min_x = 1;
  double min_y = 2;
  double max_x = 3;
  double max_y = 4;
}


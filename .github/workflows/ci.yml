name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Atlas is a local authoring tool only (spec §6.4); never install it in CI.
  MISE_DISABLE_TOOLS: atlas
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
  # Optional: raises buf.build rate limits for remote plugins. Empty on forks.
  BUF_TOKEN: ${{ secrets.BUF_TOKEN }}

jobs:
  # Decides whether the code jobs below can be skipped: only for a pull request
  # whose every changed file is docs (docs/docs-only-ci/spec.md).
  changes:
    name: Detect docs-only changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # list the PR's changed files
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Test the classification scripts
        run: sh scripts/changed-code_test.sh
      - name: Classify the changed files
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            code=true
          elif [ "$CHANGED_FILES" -ge 3000 ]; then
            # The files API lists at most 3,000 files, so the list can't be complete.
            code=true
          else
            # Renames list both names, so code moved into docs/ is still code.
            code=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
              --jq '.[] | .filename, (.previous_filename // empty)' | sh scripts/changed-code.sh)
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Code changed: $code"

  # The four code jobs skip only when `changes` explicitly says "false". If it
  # fails or gives no output, they run: `!cancelled()` overrides the default of
  # skipping when a needed job failed, and a skipped required check would pass.
  go:
    name: Go build, vet, unit and integration tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: go
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-
      - run: go build ./...
      - run: go vet ./... && go vet -tags integration ./... && go vet -tags e2e ./...
      - name: Unit and handler tests
        run: go test ./...
      - name: Integration and migration tests (PostGIS testcontainer)
        run: go test -tags integration ./...

  proto:
    # buf breaking runs in breaking.yml, which also re-runs when the PR title changes.
    name: Protos and generated code
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: go buf node
      - name: buf lint
        working-directory: api
        run: buf lint
      - name: buf format
        working-directory: api
        run: buf format --diff --exit-code
      - name: Generated Go code is up to date
        run: |
          mise run generate
          git diff --exit-code -- api/gen/go internal/gen/go || {
            echo "::error::Generated Go code is stale. Run \`mise run generate\` and commit the result."
            exit 1
          }
  sdk:
    name: JS SDK packs and imports
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: go buf node
      - run: mise run generate
      - name: One export per public proto
        run: |
          exports=$(grep -c '^export' sdk/js/index.js)
          protos=$(find api/proto/public -name '*.proto' | wc -l)
          echo "exports=$exports protos=$protos"
          test "$exports" -eq "$protos"
      - name: Pack, install and import
        run: |
          npm pack --pack-destination "$RUNNER_TEMP" ./sdk/js
          mkdir "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y >/dev/null && npm pkg set type=module
          npm install --no-audit --no-fund "$RUNNER_TEMP"/civil-labs-civil-os-api-*.tgz @connectrpc/connect@2 @connectrpc/connect-web@2
          node --input-type=module -e '
            const api = await import("@civil-labs/civil-os-api");
            if (api.ParcelsService?.typeName !== "civil.public.parcels.v1.ParcelsService") throw new Error("ParcelsService missing");
            console.log("imported", Object.keys(api).length, "exports");'

  e2e:
    name: E2E (docker compose)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: go
      - name: Start the stack and run the smoke tests
        run: mise run test:e2e
      - name: Token task works
        run: test -n "$(mise run token)"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: mise run down

  customer-data:
    name: No customer-specific data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Check tracked files against CUSTOMER_DENYLIST
        env:
          CUSTOMER_DENYLIST: ${{ secrets.CUSTOMER_DENYLIST }}
        run: sh scripts/check-denylist.sh

[tools]
go = "1.26.1"
buf = "1.66.1"
node = "22.23.4"
# Local migration authoring only. Never installed or run in CI (spec §6.4).
atlas = "1.3.0"

[tasks.generate]
description = "Regenerate all code from api/proto (Go committed; JS and OpenAPI are build outputs)"
dir = "api"
run = [
  "rm -rf gen/go ../internal/gen/go gen/openapi ../sdk/js/gen",
  "buf generate proto/public --template buf.gen.public.yaml",
  "buf generate proto/mesh --template buf.gen.mesh.yaml",
  "node ../sdk/js/scripts/gen-index.mjs",
]

[tasks.build]
description = "Build every Go package"
run = "go build ./..."

[tasks.test]
description = "Run unit and handler tests"
run = "go test ./..."

[tasks."test:integration"]
description = "Run integration tests against a PostGIS test container (needs Docker)"
run = "go test -tags integration ./..."

[tasks."test:e2e"]
description = "Start (or rebuild) the compose stack, then run the end-to-end smoke tests against it"
depends = ["up"]
run = "go test -count=1 -tags e2e ./test/e2e/..."

[tasks.up]
description = "Build and start the full local stack on synthetic data, and wait until it is healthy"
quiet = true # don't echo the commands; compose's own progress output still shows
run = [
  "docker compose up --build --wait --wait-timeout 300",
  """echo '
civil-os is up (synthetic data):
  gateway        http://localhost:8080
  Dex issuer     http://localhost:5556/dex
  token          TOKEN=$(mise run token)
  stop           mise run down   (deletes the database)

OAuth2 client (dev/dex.yaml), e.g. for Bruno or Postman:
  client_id      civil-os-dev
  client_secret  civil-os-dev-secret
  redirect_url   http://localhost:3000/callback
  authorize_url  http://localhost:5556/dex/auth
  token_url      http://localhost:5556/dex/token
  scope          openid email profile

Test user (password grant, or the Dex login page):
  username       dev@example.com
  password       civil-os-dev-password' >&2""",
]

[tasks.down]
description = "Stop the local stack and delete its database volume"
run = "docker compose down -v --remove-orphans"

[tasks.token]
description = "Print an ID token for the local test user (use as TOKEN=$(mise run token))"
run = "sh dev/token.sh"

[tasks.lint]
description = "Vet Go code and lint protos"
run = ["go vet ./...", "buf lint api"]

[tasks.check]
description = "Everything CI runs that needs no Docker"
depends = ["build", "lint", "test"]

[tasks."db:diff"]
description = "Generate a new versioned migration from database/schema (needs local Atlas Pro login)"
dir = "database"
run = '''
git add --renormalize .
git ls-files -z | xargs -0 sed -i 's/\r$//'
atlas migrate diff --env local
'''

[tasks."db:validate"]
description = "Verify database/migrations/atlas.sum (local only; CI has no Atlas license)"
dir = "database"
run = "atlas migrate validate --env local"

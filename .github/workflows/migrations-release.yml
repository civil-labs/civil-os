name: Migrations ConfigMap

# On an app release tag, package database/migrations as a versioned
# ConfigMap and attach it to the GitHub Release. Nothing is committed.
# No Atlas here (spec §6.4): kubectl only renders the manifest.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # upload the release asset

jobs:
  configmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Render ConfigMap
        run: |
          name="civil-os-db-migrations-$(echo "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | tr '._' '--')"
          echo "ConfigMap: $name"
          kubectl create configmap "$name" \
            --from-file=database/migrations \
            --dry-run=client -o yaml > migrations-configmap.yaml
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # release-please creates the release with the tag; allow a moment for it.
          for i in 1 2 3 4 5 6; do
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break
            sleep 10
          done
          gh release upload "$GITHUB_REF_NAME" migrations-configmap.yaml --clobber

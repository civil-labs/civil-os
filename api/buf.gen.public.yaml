# Public API: importable Go, the npm SDK and the public OpenAPI spec.
# Run via `mise run generate` from the repo root. Outputs are relative to api/.
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/civil-labs/civil-os/api/gen/go
  disable:
    - file_option: go_package
      module: buf.build/bufbuild/protovalidate
    - file_option: go_package
      module: buf.build/gnostic/gnostic
    - file_option: go_package
      module: buf.build/googleapis/googleapis
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go:v1.19.1
    out: gen/go
    opt: paths=source_relative
  # Committed? No: built at publish time into the npm package (sdk/js).
  - remote: buf.build/bufbuild/es:v2.11.0
    out: ../sdk/js/gen
    include_imports: true
    opt:
      - target=js+dts
      # Node's ESM loader needs explicit extensions on relative imports.
      - import_extension=js
  # Committed? No: attached to Public API releases.
  - remote: buf.build/community/sudorandom-connect-openapi
    out: gen/openapi
    opt:
      - format=yaml
      - path=openapi.yaml
      - features=connectrpc;google.api.http;gnostic;protovalidate

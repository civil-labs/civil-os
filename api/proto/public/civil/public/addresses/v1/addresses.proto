syntax = "proto3";

package civil.public.addresses.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "google/type/latlng.proto";

// Reads addresses. The records at an address are read from their own
// services: `ParcelsService.GetParcelsByAddressId`,
// `ImprovementsService.GetImprovementsByAddressId` and
// `PartiesService.GetPartiesByAddressId`.
//
// Every read takes an optional `legal_as_of`, defaulting to now. An address
// is returned only when it isn't voided and has a record at that time.
service AddressesService {
  // Returns the requested addresses. Unknown IDs, voided addresses and
  // addresses with no record at `legal_as_of` are left out.
  rpc GetAddressesById(GetAddressesByIdRequest) returns (GetAddressesByIdResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// An address as of `legal_as_of`.
message Address {
  // The address's UUID.
  string address_id = 1;

  // The whole address as one line.
  string formatted_address = 2;

  optional string address_line_1 = 3;
  optional string address_line_2 = 4;
  optional string address_line_3 = 5;
  optional string locality = 6;
  optional string sublocality = 7;
  optional string postal_code = 8;
  optional AdministrativeArea administrative_area = 9;
  optional Country country = 10;

  // The address's location in WGS84. Unset when the address has no
  // coordinates.
  optional google.type.LatLng coordinates = 11;
}

message Country {
  // The ISO 3166-1 alpha-2 code.
  string code = 1;
  string name = 2;
}

// A state, province or similar subdivision of a country.
message AdministrativeArea {
  // Up to 10 characters.
  string code = 1;
  string name = 2;
}

message GetAddressesByIdRequest {
  // 1 to 100 unique address UUIDs.
  repeated string address_ids = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
    unique: true
    items: {
      string: {uuid: true}
    }
  }];

  // The legal time to read the addresses at. Defaults to now.
  optional google.protobuf.Timestamp legal_as_of = 2 [(buf.validate.field).timestamp = {
    // Bounded to prevent integer overflow or absurd historical queries
    gt: {seconds: -62135596800} /* Approx Jan 1, 0 CE */
  }];
}

message GetAddressesByIdResponse {
  // The addresses found, keyed by address UUID.
  map<string, Address> addresses = 1;
}
